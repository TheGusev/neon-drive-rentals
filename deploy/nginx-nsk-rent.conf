# NSK-RENT — конфиг nginx для nsk-rent.ru
# Главная причина медленной/срывающейся загрузки с телефонов:
#   - статика (JS/CSS) отдавалась БЕЗ gzip (бандл ~880 КБ вместо ~250 КБ);
#   - не был включён HTTP/2 (браузер ограничен 6 соединениями на ~120 запросов).
# Файл кладём в /etc/nginx/sites-available/nsk-rent.ru и перезапускаем nginx:
#   sudo nginx -t && sudo systemctl reload nginx

# --- www -> апекс -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nsk-rent.ru;

    ssl_certificate     /etc/letsencrypt/live/nsk-rent.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsk-rent.ru/privkey.pem;

    return 301 https://nsk-rent.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nsk-rent.ru www.nsk-rent.ru;
    return 301 https://nsk-rent.ru$request_uri;
}

# --- основной сайт ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nsk-rent.ru;

    ssl_certificate     /etc/letsencrypt/live/nsk-rent.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nsk-rent.ru/privkey.pem;

    # ---- сжатие (ключевой пункт) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Если установлен модуль brotli — включите и его (лучше gzip на ~15%):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 25m;

    # ---- статика приложения ----
    location /assets/ {
        root /var/www/nsk-rent/.output/public;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
    }

    # ---- приложение (TanStack Start / node-server) ----
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }
}
