name: Deploy to nsk-rent.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: bun run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build output
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/shared/car-uploads'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT || 22 }}" \
            .output/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.output/"

          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/.output/public/assets/cars' && rm -rf '${{ secrets.DEPLOY_PATH }}/.output/public/assets/cars/uploads' && ln -s '${{ secrets.DEPLOY_PATH }}/shared/car-uploads' '${{ secrets.DEPLOY_PATH }}/.output/public/assets/cars/uploads'"

      - name: Restart app
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${{ secrets.RESTART_COMMAND }}"

      - name: Verify deployed version
        run: |
          sleep 10
          curl -sS --fail https://nsk-rent.ru/api/public/version
          curl -sS --fail https://nsk-rent.ru/api/public/health
          curl -sS --fail https://nsk-rent.ru/ | grep -q "NSK-RENT"
          curl -sS --fail -o /dev/null https://nsk-rent.ru/favicon.png
